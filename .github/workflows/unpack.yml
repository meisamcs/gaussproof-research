name: Import GAUSSPROOF snapshot

on:
  push:
    paths:
      - gaussproof_student_repository.zip
      - .github/workflows/unpack.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified repository snapshot
        shell: bash
        run: |
          if [[ ! -f gaussproof_student_repository.zip ]]; then
            echo "Snapshot already imported."
            exit 0
          fi
          unzip -q gaussproof_student_repository.zip -d unpacked
          cp -a unpacked/gaussproof/. .
          rm -f .github/workflows/tests.yml
          rm -rf unpacked gaussproof_student_repository.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete GAUSSPROOF research repository"
          git push
