[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussproof-mia"
version = "0.1.0"
description = "Reproducible black-box and gradient-trajectory membership inference benchmark"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "torch>=2.2,<3", "matplotlib>=3.7,<4"]

[project.scripts]
gaussproof = "gaussproof.cli:main"

[tool.setuptools.packages.find]
include = ["gaussproof*"]
